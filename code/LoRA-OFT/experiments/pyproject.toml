[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loraoft"
version = "0.1.0"
description = "Controlled comparison of LoRA, DoRA, and original OFT in LLM post-training"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Install the bundled PEFT build before this package.
dependencies = [
    "torch>=2.6",
    "transformers>=4.51",
    "peft==0.20.0",
    "accelerate>=1.0",
    "datasets>=3.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["loraoft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device",
    "slow: takes more than a few seconds",
]
